<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Admin · Bingo Server</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        /* Simplified admin styles – identical to earlier Firebase version, but we use Socket.IO */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0b1a2a;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 20px;
            min-height: 100vh;
            color: #d4e6fa;
        }
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 2px solid rgba(60, 120, 170, 0.2);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .admin-header h1 {
            color: #f5e7c8;
            font-size: 1.8rem;
            letter-spacing: 2px;
        }
        .admin-header h1 span {
            color: #f5c542;
        }
        .admin-header .status {
            color: #7ddfa0;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .admin-header .status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .admin-header .status .dot.online {
            background: #7ddfa0;
            box-shadow: 0 0 10px rgba(125, 223, 160, 0.4);
        }
        .admin-header .status .dot.offline {
            background: #ff6b6b;
            box-shadow: 0 0 10px rgba(255, 80, 80, 0.3);
        }
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }
        }
        .admin-card {
            background: rgba(20, 45, 70, 0.6);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(60, 120, 170, 0.15);
        }
        .admin-card h2 {
            color: #f5e7c8;
            font-size: 1.1rem;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(60, 120, 170, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-card .count {
            color: #8ab0c8;
            font-size: 0.8rem;
            font-weight: 400;
        }
        .transaction-list {
            max-height: 500px;
            overflow-y: auto;
        }
        .transaction-list::-webkit-scrollbar {
            width: 4px;
        }
        .transaction-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        .transaction-list::-webkit-scrollbar-thumb {
            background: rgba(80, 150, 200, 0.3);
            border-radius: 10px;
        }
        .tx-item {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border-left: 4px solid #f5d76e;
            transition: all 0.3s;
        }
        .tx-item.approved {
            border-left-color: #7ddfa0;
            opacity: 0.7;
        }
        .tx-item.rejected {
            border-left-color: #ff6b6b;
            opacity: 0.7;
        }
        .tx-item .tx-info {
            flex: 1;
            min-width: 140px;
        }
        .tx-item .tx-info .user {
            font-weight: 700;
            color: #f5e7c8;
            font-size: 0.95rem;
        }
        .tx-item .tx-info .details {
            font-size: 0.7rem;
            color: #8ab0c8;
        }
        .tx-item .tx-amount {
            font-weight: 800;
            font-size: 1.1rem;
            color: #f5c542;
            min-width: 60px;
        }
        .tx-item .tx-actions {
            display: flex;
            gap: 6px;
        }
        .tx-item .tx-actions button {
            padding: 4px 14px;
            border-radius: 20px;
            border: none;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tx-item .tx-actions .approve {
            background: #2a8a4a;
            color: #f0fff0;
        }
        .tx-item .tx-actions .approve:hover:not(:disabled) {
            background: #3aaa5a;
            transform: scale(1.02);
        }
        .tx-item .tx-actions .reject {
            background: #8a2a2a;
            color: #fff0f0;
        }
        .tx-item .tx-actions .reject:hover:not(:disabled) {
            background: #aa3a3a;
            transform: scale(1.02);
        }
        .tx-item .tx-actions button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }
        .tx-item .tx-status {
            font-size: 0.65rem;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            white-space: nowrap;
        }
        .tx-item .tx-status.pending {
            background: rgba(200, 180, 60, 0.2);
            color: #f5d76e;
        }
        .tx-item .tx-status.approved {
            background: rgba(70, 200, 120, 0.2);
            color: #7ddfa0;
        }
        .tx-item .tx-status.rejected {
            background: rgba(200, 70, 70, 0.2);
            color: #ff8a8a;
        }
        .tx-timestamp {
            font-size: 0.6rem;
            color: #4a6a8a;
            min-width: 50px;
            text-align: right;
        }
        .player-list {
            max-height: 500px;
            overflow-y: auto;
        }
        .player-list::-webkit-scrollbar {
            width: 4px;
        }
        .player-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        .player-list::-webkit-scrollbar-thumb {
            background: rgba(80, 150, 200, 0.3);
            border-radius: 10px;
        }
        .player-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .player-item .p-name {
            font-weight: 700;
            color: #f5e7c8;
        }
        .player-item .p-wallets {
            display: flex;
            gap: 12px;
            font-size: 0.8rem;
        }
        .player-item .p-wallets span {
            color: #8ab0c8;
        }
        .player-item .p-wallets .main {
            color: #f5c542;
        }
        .player-item .p-wallets .play {
            color: #7ddfa0;
        }
        .player-item .p-wallets .pending {
            color: #f5d76e;
        }
        .empty-state {
            color: #4a6a8a;
            text-align: center;
            padding: 30px 0;
            font-size: 0.9rem;
        }
        .refresh-btn {
            background: rgba(40, 80, 120, 0.3);
            border: 1px solid rgba(60, 120, 170, 0.2);
            border-radius: 30px;
            padding: 6px 16px;
            color: #8ab0c8;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .refresh-btn:hover {
            background: rgba(40, 80, 120, 0.5);
        }
        .refresh-btn:active {
            transform: scale(0.95);
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(10, 26, 42, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(245, 197, 66, 0.3);
            border-radius: 12px;
            padding: 12px 20px;
            color: #d4e6fa;
            font-size: 0.85rem;
            z-index: 1000;
            animation: slideUp 0.3s ease;
            display: none;
            max-width: 350px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }
        .toast.show {
            display: block;
        }
        .toast.success {
            border-color: #7ddfa0;
        }
        .toast.error {
            border-color: #ff6b6b;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .login-overlay.hidden {
            display: none;
        }
        .login-box {
            background: #1e3a55;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(245, 197, 66, 0.2);
            max-width: 400px;
            width: 100%;
        }
        .login-box h2 {
            color: #f5e7c8;
            margin-bottom: 20px;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            border: 2px solid rgba(60, 120, 170, 0.4);
            background: #0a1a2a;
            color: #e8f0f8;
            font-size: 1rem;
            margin-bottom: 12px;
            outline: none;
        }
        .login-box input:focus {
            border-color: #f5c542;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #f5c542, #e6a820);
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            color: #1a2a1a;
            cursor: pointer;
        }
        .login-box .error {
            color: #ff6b6b;
            text-align: center;
            margin-top: 8px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- Login overlay -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>🔐 Admin Login</h2>
            <input type="password" id="adminPassword" placeholder="Admin password" />
            <button id="adminLoginBtn">Login</button>
            <div class="error" id="adminLoginError"></div>
        </div>
    </div>

    <div class="admin-container">
        <div class="admin-header">
            <h1>🎯 <span>BINGO</span> · Admin</h1>
            <div class="status">
                <span class="dot online" id="statusDot"></span>
                <span id="adminStatus">🟢 Online</span>
                <button class="refresh-btn" id="refreshBtn">⟳ Refresh</button>
            </div>
        </div>

        <div class="admin-grid">
            <div class="admin-card">
                <h2>
                    📋 Transactions
                    <span class="count" id="txCount">(0)</span>
                </h2>
                <div class="transaction-list" id="transactionList">
                    <div class="empty-state">No transactions</div>
                </div>
            </div>

            <div class="admin-card">
                <h2>
                    👥 Players
                    <span class="count" id="playerCount">(0)</span>
                </h2>
                <div class="player-list" id="playerList">
                    <div class="empty-state">No players registered</div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const socket = io();

        // Login state
        let isAdmin = false;
        let transactions = [];
        let users = {};

        // DOM refs
        const loginOverlay = document.getElementById('loginOverlay');
        const adminPassword = document.getElementById('adminPassword');
        const adminLoginBtn = document.getElementById('adminLoginBtn');
        const adminLoginError = document.getElementById('adminLoginError');
        const adminStatus = document.getElementById('adminStatus');
        const statusDot = document.getElementById('statusDot');
        const txList = document.getElementById('transactionList');
        const txCount = document.getElementById('txCount');
        const playerList = document.getElementById('playerList');
        const playerCount = document.getElementById('playerCount');
        const refreshBtn = document.getElementById('refreshBtn');
        const toast = document.getElementById('toast');
        let toastTimeout;

        function showToast(msg, type = 'success') {
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function renderTransactions() {
            const pending = transactions.filter(t => t.status === 'pending');
            txCount.textContent = `(${transactions.length} · ${pending.length} pending)`;
            if (transactions.length === 0) {
                txList.innerHTML = '<div class="empty-state">No transactions</div>';
                return;
            }
            let html = '';
            transactions.slice().reverse().forEach(tx => {
                const statusClass = tx.status || 'pending';
                const isPending = statusClass === 'pending';
                const date = new Date(tx.timestamp).toLocaleString();
                html += `
                    <div class="tx-item ${statusClass}">
                        <div class="tx-info">
                            <div class="user">${tx.username || 'Unknown'}</div>
                            <div class="details">${tx.type || 'Transaction'} · ${tx.amount || 0} Birr</div>
                        </div>
                        <span class="tx-status ${statusClass}">${statusClass.charAt(0).toUpperCase() + statusClass.slice(1)}</span>
                        <div class="tx-actions">
                            <button class="approve" ${!isPending ? 'disabled' : ''} data-txid="${tx.id}" onclick="approve('${tx.id}')">✅ Approve</button>
                            <button class="reject" ${!isPending ? 'disabled' : ''} data-txid="${tx.id}" onclick="reject('${tx.id}')">❌ Reject</button>
                        </div>
                        <div class="tx-timestamp">${date}</div>
                    </div>
                `;
            });
            txList.innerHTML = html;
        }

        function renderPlayers() {
            const entries = Object.entries(users);
            playerCount.textContent = `(${entries.length})`;
            if (entries.length === 0) {
                playerList.innerHTML = '<div class="empty-state">No players registered</div>';
                return;
            }
            let html = '';
            entries.forEach(([username, data]) => {
                const main = data.mainWallet || 0;
                const play = data.playWallet || 0;
                const pending = data.pendingWithdrawal || 0;
                html += `
                    <div class="player-item">
                        <span class="p-name">${username}</span>
                        <div class="p-wallets">
                            <span class="main">💰 ${main}</span>
                            <span class="play">🎰 ${play}</span>
                            ${pending > 0 ? `<span class="pending">⏳ ${pending}</span>` : ''}
                        </div>
                    </div>
                `;
            });
            playerList.innerHTML = html;
        }

        // Socket events
        socket.on('connect', () => {
            statusDot.className = 'dot online';
            adminStatus.textContent = '🟢 Online';
        });
        socket.on('disconnect', () => {
            statusDot.className = 'dot offline';
            adminStatus.textContent = '🔴 Offline';
        });

        socket.on('adminLoginSuccess', () => {
            isAdmin = true;
            loginOverlay.classList.add('hidden');
            showToast('✅ Logged in as admin', 'success');
        });

        socket.on('adminLoginError', (msg) => {
            adminLoginError.textContent = msg;
        });

        socket.on('adminTransactions', (data) => {
            transactions = data || [];
            renderTransactions();
        });

        socket.on('adminUsers', (data) => {
            users = data || {};
            renderPlayers();
        });

        // Admin actions
        function approve(txId) {
            socket.emit('adminApprove', { txId });
            // Disable button locally
            const btn = document.querySelector(`button[data-txid="${txId}"].approve`);
            if (btn) btn.disabled = true;
        }

        function reject(txId) {
            socket.emit('adminReject', { txId });
            const btn = document.querySelector(`button[data-txid="${txId}"].reject`);
            if (btn) btn.disabled = true;
        }

        // Login button
        adminLoginBtn.onclick = () => {
            const pass = adminPassword.value.trim();
            if (!pass) { adminLoginError.textContent = 'Enter password'; return; }
            adminLoginError.textContent = '';
            socket.emit('adminLogin', { password: pass });
        };
        adminPassword.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') adminLoginBtn.click();
        });

        // Refresh
        refreshBtn.onclick = () => {
            if (isAdmin) {
                socket.emit('adminLogin', { password: 'admin123' }); // re‑fetch
                showToast('🔄 Refreshed', 'success');
            }
        };

        // Auto‑reconnect
        socket.on('connect', () => {
            if (isAdmin) {
                // Re‑login
                socket.emit('adminLogin', { password: 'admin123' });
            }
        });

        // Initial state
        loginOverlay.classList.remove('hidden');
    </script>
</body>
</html>
